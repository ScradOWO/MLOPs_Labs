# CI/CD for GitHub_Actions_Lab: test -> train + quality gate -> (manual) release.
# Lives at the repo root because GitHub only reads workflows from .github/workflows/.
name: GitHub Actions Lab - test, train, gate, release

on:
  push:
    branches: [main]
    paths: ["GitHub_Actions_Lab/**", ".github/workflows/github_actions_lab.yml"]
  pull_request:
    paths: ["GitHub_Actions_Lab/**", ".github/workflows/github_actions_lab.yml"]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: "Trees in the random forest"
        type: string
        default: "200"
      min_f1:
        description: "Minimum macro F1 for the gate"
        type: string
        default: "0.90"
      release:
        description: "Publish the model as a GitHub Release if the gate passes"
        type: boolean
        default: false

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: github-actions-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # explicit bash adds -o pipefail, so `cmd | tee` still fails the step
    working-directory: GitHub_Actions_Lab

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]  # numpy 2.5 needs Python 3.12+
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: GitHub_Actions_Lab/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: GitHub_Actions_Lab/test-results.xml

  train-and-gate:
    name: Train, compare with released model, gate
    needs: test
    runs-on: ubuntu-latest
    env:
      N_ESTIMATORS: ${{ inputs.n_estimators || '200' }}
      MIN_F1: ${{ inputs.min_f1 || '0.90' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GitHub_Actions_Lab/requirements.txt
      - run: pip install -r requirements.txt

      - name: Train and calibrate
        run: python src/train.py --out build --n-estimators "$N_ESTIMATORS"

      - name: Fetch baseline (metrics of the latest model release)
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                --jq '[.[] | select(.tagName | startswith("model-"))][0].tagName // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern metrics.json --dir baseline
            echo "Baseline: $tag"
          else
            echo "No model release yet: gate runs absolute checks only."
          fi

      - name: Quality gate
        run: python src/gate.py build/metrics.json --baseline baseline/metrics.json --min-f1 "$MIN_F1" | tee build/gate_report.md

      - name: Upload model + metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-${{ github.run_number }}
          path: GitHub_Actions_Lab/build/
          if-no-files-found: ignore

  release:
    name: Release model
    needs: train-and-gate
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: model-${{ github.run_number }}
          path: model
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "model-${{ github.run_number }}" model/model.joblib model/metrics.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Digits model ${{ github.run_number }}" --notes-file model/gate_report.md
