# Ship the model's JSON log lines into Elasticsearch, one index per event type.
input {
  file {
    path => "/logs/*.jsonl"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => "json"   # every line the app writes is one JSON object
  }
}

filter {
  # Use the app's own event time, not the time Logstash read the line.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }
  # File-input bookkeeping we don't need in every document.
  mutate {
    remove_field => ["log", "host", "event", "@version"]
  }
  if [event_type] == "prediction" and [latency_ms] and [latency_ms] > 50 {
    mutate { add_tag => ["slow_request"] }
  }
  if [event_type] == "drift" and [alert] {
    mutate { add_tag => ["drift_alert"] }
  }
}

output {
  if [event_type] == "prediction" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "ml-predictions" data_stream => "false" }
  } else if [event_type] == "drift" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "ml-drift" data_stream => "false" }
  } else {
    # Anything unparseable (tagged _jsonparsefailure) lands here instead of disappearing.
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "ml-unparsed" data_stream => "false" }
  }
}
